name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  version:
    name: Determine Version
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.version.outputs.should_release }}
      version: ${{ steps.version.outputs.version }}
      version_tag: ${{ steps.version.outputs.version_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version bump
        id: version
        run: |
          # Get the latest tag, default to v0.0.0 if none exists
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Latest tag: $LATEST_TAG"

          # Remove 'v' prefix and split version
          VERSION=${LATEST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          # Get the commit message
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Commit message: $COMMIT_MSG"

          # Determine version bump based on commit message
          SHOULD_RELEASE="true"

          if echo "$COMMIT_MSG" | grep -qE "^(feat|feature)(\(.+\))?!:|BREAKING[ -]CHANGE"; then
            # Major version bump for breaking changes
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
            echo "Breaking change detected: bumping major version"
          elif echo "$COMMIT_MSG" | grep -qE "^(feat|feature)(\(.+\))?:"; then
            # Minor version bump for features
            MINOR=$((MINOR + 1))
            PATCH=0
            echo "Feature detected: bumping minor version"
          elif echo "$COMMIT_MSG" | grep -qE "^fix(\(.+\))?:"; then
            # Patch version bump for fixes
            PATCH=$((PATCH + 1))
            echo "Fix detected: bumping patch version"
          else
            # No release for chore, docs, style, refactor, test, etc.
            echo "No version bump needed for this commit type"
            SHOULD_RELEASE="false"
          fi

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          NEW_TAG="v${NEW_VERSION}"

          echo "should_release=$SHOULD_RELEASE" >> $GITHUB_OUTPUT
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "version_tag=$NEW_TAG" >> $GITHUB_OUTPUT

          echo "New version: $NEW_TAG"

  build:
    name: Build - ${{ matrix.target }}
    needs: version
    if: needs.version.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: linux-amd64
          - target: x86_64-apple-darwin
            os: macos-latest
            name: macos-intel
          - target: aarch64-apple-darwin
            os: macos-latest
            name: macos-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifact
        run: |
          cd target/${{ matrix.target }}/release
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            tar czf crepe-${{ needs.version.outputs.version }}-${{ matrix.name }}.tar.gz crepe
          else
            tar czf crepe-${{ needs.version.outputs.version }}-${{ matrix.name }}.tar.gz crepe
          fi
          mv crepe-${{ needs.version.outputs.version }}-${{ matrix.name }}.tar.gz ../../../

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: crepe-${{ matrix.name }}
          path: crepe-${{ needs.version.outputs.version }}-${{ matrix.name }}.tar.gz

  release:
    name: Create Release
    needs: [version, build]
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.version.outputs.version_tag }}
          name: Release ${{ needs.version.outputs.version_tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/crepe-linux-amd64/crepe-${{ needs.version.outputs.version }}-linux-amd64.tar.gz
            artifacts/crepe-macos-intel/crepe-${{ needs.version.outputs.version }}-macos-intel.tar.gz
            artifacts/crepe-macos-arm64/crepe-${{ needs.version.outputs.version }}-macos-arm64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
